version: '3.8'

services:
  nexus-control-tower:
    build: .
    container_name: nexus-control-tower
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./nexus.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./nexus.db:/app/nexus.db
    restart: unless-stopped
